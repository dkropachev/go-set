name: Test release automation

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [master]
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - run: node --test .github/tests/release.test.cjs
